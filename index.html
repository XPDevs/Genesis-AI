<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icon.ico">
<title>Genesis AI Chat</title>

<style>
  /* Base Styles & Theme */
  :root {
    --sidebar-width: 260px;
    --sidebar-collapsed-width: 70px;
    --bg-dark: #000;
    --sidebar-bg: #111;
    --accent: #007bff;
    --text-main: #fff;
    --transition-speed: 0.3s;
  }

  body { 
    visibility: hidden; 
    background-color: var(--bg-dark); 
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    color: var(--text-main);
  }

  /* --- Sidebar Layout --- */
  .sidebar {
    width: var(--sidebar-width);
    background-color: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    transition: width var(--transition-speed) ease;
    border-right: 1px solid #333;
    position: relative;
    overflow: hidden;
  }

  /* Collapsed State Class */
  .sidebar.collapsed {
    width: var(--sidebar-collapsed-width);
  }

  .sidebar-header {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Toggle Button */
  #toggleSidebarBtn {
    background: transparent;
    border: none;
    color: white;
    font-size: 1.2rem;
    cursor: pointer;
    align-self: flex-start;
    padding: 5px 10px;
    border-radius: 8px;
  }
  
  #toggleSidebarBtn:hover { background: #222; }

  #newChatBtn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-align: center;
  }

  #settingsBtn {
    background: #222;
    border: none;
    color: white;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
  }

  /* Hide text and list when collapsed */
  .sidebar.collapsed .chat-list,
  .sidebar.collapsed #newChatBtn span,
  .sidebar.collapsed #chatTitleText {
    display: none;
  }

  /* Center icons when collapsed */
  .sidebar.collapsed .sidebar-header {
    align-items: center;
  }

  .chat-list {
    flex-grow: 1;
    list-style: none;
    padding: 0 10px;
    margin: 0;
    overflow-y: auto;
  }

  /* --- Main Chat Area --- */
  .chat-main {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    background: #000;
  }

  .chat-header {
    padding: 16px;
    border-bottom: 1px solid #222;
  }

  .chat-box {
    flex-grow: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .input-area {
    padding: 20px;
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex-grow: 1;
    background: #111;
    border: 1px solid #333;
    color: white;
    padding: 12px;
    border-radius: 12px;
  }

  #sendBtn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 12px;
    cursor: pointer;
  }

  /* Modals */
  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
  .modal-content { background: #111; margin: 10% auto; padding: 20px; border-radius: 16px; width: 80%; max-width: 400px; text-align: center; }
</style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebarBtn">☰</button>
      <button id="newChatBtn">
        <span class="icon">+</span> <span id="newChatText">New Chat</span>
      </button>
      <button id="settingsBtn">⚙️ Settings</button>
    </div>
    
    <ul id="chatList" class="chat-list">
      </ul>
  </aside>

  <main class="chat-main">
    <div class="chat-header">
      <h3 id="chatTitle">Genesis AI</h3>
    </div>
    
    <div id="chatBox" class="chat-box"></div>
    
    <div id="contentWarning" style="padding:8px; background:#222; color:#bbb; border:1px solid #333; border-radius:12px; margin:0 16px 8px 16px; font-size:0.85em;">
      Content Warning: Content may be inaccurate. 
      See <a href="https://xpdevs.github.io/Genesis-AI/legal/privacy-policy" target="_blank" style="color:var(--accent);">Privacy Policy</a>.
    </div>
