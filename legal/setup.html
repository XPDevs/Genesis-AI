<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis-AI | Legal Consent</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --card: #161616;
            --accent: #3b82f6;
            --text: #e5e7eb;
            --border: #2d2d2d;
            --radius: 12px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .consent-box {
            background: var(--card);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 { margin-top: 0; font-size: 1.25rem; }
        p { color: #9ca3af; font-size: 0.9rem; margin-bottom: 2rem; }

        .checkbox-container {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 2rem;
        }

        .row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        input[type="checkbox"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
            margin-top: 2px;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .btn-continue {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-continue:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="consent-box">
    <h2>Legal Agreement</h2>
    <p>Please review and accept our policies to continue to Genesis-AI.</p>

    <div class="checkbox-container">
        <label class="row">
            <input type="checkbox" id="tos">
            <span>I have read and agree to the <a href="https://xpdevs.github.io/Genesis-AI/legal/terms-of-service" target="_blank">Terms of Service</a></span>
        </label>
        
        <label class="row">
            <input type="checkbox" id="pp">
            <span>I have read and agree to the <a href="https://xpdevs.github.io/Genesis-AI/legal/privacy-policy" target="_blank">Privacy Policy</a></span>
        </label>
    </div>

    <button id="proceed" class="btn-continue" disabled>Accept and Continue</button>
</div>

<script>
    const tosCheck = document.getElementById('tos');
    const ppCheck = document.getElementById('pp');
    const btn = document.getElementById('proceed');

    function checkConsent() {
        btn.disabled = !(tosCheck.checked && ppCheck.checked);
    }

    tosCheck.addEventListener('change', checkConsent);
    ppCheck.addEventListener('change', checkConsent);

    btn.addEventListener('click', () => {
        // Set the flag for the main site logic
        localStorage.setItem("SETUP", "FLAG_TRUE");
        
        // Return to the main directory
        window.location.href = "https://xpdevs.github.io/Genesis-AI/";
    });
</script>

</body>
</html>
