<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="https://xpdevs.github.io/Genesis-AI/icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Genesis-AI Blog</title>
<style>
:root { --bg:#ffffff; --text:#1f1f1f; --input-bg:#f0f4f9; --border:#dee2e6; --primary:#1a73e8; }
body.dark { --bg:#000000; --text:#e3e3e3; --input-bg:#1e1f20; --border:#444746; }
* { box-sizing: border-box; }
body { margin:0; font-family:"Inter","Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
.container { max-width:760px; margin:0 auto; padding:40px 24px; }
a { color:var(--primary); text-decoration:none; }
a:hover { text-decoration:underline; }
h1 { font-size:2rem; margin:0 0 24px; }
.card { background:var(--input-bg); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:16px; display:block; color:var(--text); text-decoration:none; }
.card:hover { box-shadow:0 4px 15px rgba(0,0,0,0.08); }
.card h2 { margin:0 0 8px; font-size:1.2rem; }
.card p { margin:0; opacity:0.85; }
.back { display:inline-block; margin-bottom:24px; }
</style>
</head>
<body>
<div class="container">
  <a href="../index" class="back">&larr; Back to Genesis-AI</a>
  <h1>Genesis-AI Blog</h1>
  <a href="first-post" class="card">
    <h2>Welcome to Genesis-AI</h2>
    <p>An introduction to the project, how it works, and why we built a transparent, browser-based AI.</p>
  </a>
</div>
<script>
(function(){const t=localStorage.getItem('genesis-landing-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark');})();
</script>
</body>
</html>
