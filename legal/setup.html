<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis-AI Setup</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1f1f1f;
            --primary: #1a73e8;
            --border: #dee2e6;
            --input-bg: #f0f4f9;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #131314;
                --text: #e3e3e3;
                --primary: #8ab4f8;
                --border: #444746;
                --input-bg: #1e1f20;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 90%;
            padding: 40px;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { line-height: 1.6; color: var(--text); opacity: 0.8; margin-bottom: 30px; }
        button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
            width: 100%; /* Make buttons full width */
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button:not(:disabled):hover { opacity: 0.9; }        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .legal-text {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 25px;
            margin-bottom: 0;
        }
        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }
        .checkbox-group {
            text-align: left;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        .checkbox-group label {
            font-size: 1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- Step 1: Legal Agreement -->
    <div class="container" id="step1">
        <h1>Legal Agreement</h1>
        <p>Please review and accept our terms to continue.</p>
        
        <div class="checkbox-group">
            <input type="checkbox" id="tosCheckbox">
            <label for="tosCheckbox">
                I have read and agree to the <a href="terms-of-service.html" target="_blank">Terms of Service</a>.
            </label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="ppCheckbox">
            <label for="ppCheckbox">
                I have read and agree to the <a href="privacy-policy.html" target="_blank">Privacy Policy</a>.
            </label>
        </div>
        
        <button id="legalContinueBtn" disabled>Continue</button>
    </div>

    <!-- Step 2: Name Input -->
    <div class="container hidden" id="step2">
        <h1>Profile Setup</h1>
        <p>How should Genesis-AI address you?</p>
        
        <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off">
        
        <button id="finishBtn">Finish Setup</button>
    </div>
    
    <script>
        // Elements for Step 1
        const step1 = document.getElementById('step1');
        const tosCheckbox = document.getElementById('tosCheckbox');
        const ppCheckbox = document.getElementById('ppCheckbox');
        const legalContinueBtn = document.getElementById('legalContinueBtn');

        // Elements for Step 2
        const step2 = document.getElementById('step2');
        const nameInput = document.getElementById('nameInput');
        const finishBtn = document.getElementById('finishBtn');

        // Logic for Step 1
        function checkAgreements() {
            legalContinueBtn.disabled = !(tosCheckbox.checked && ppCheckbox.checked);
        }

        // Logic for Step 2
        function completeSetup() {
            const name = nameInput.value.trim();
            if (name) {
                localStorage.setItem('userInfo', JSON.stringify({ name: name }));
                localStorage.setItem('SETUP', 'FLAG_TRUE');
                window.location.href = '../index.html';
            } else {
                alert('Please enter a name.');
                nameInput.focus();
            }
        }

        tosCheckbox.addEventListener('change', checkAgreements);
        ppCheckbox.addEventListener('change', checkAgreements);

        legalContinueBtn.addEventListener('click', () => {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            nameInput.focus();
        });

        finishBtn.addEventListener('click', completeSetup);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                completeSetup();
            }
        });
        checkAgreements();
    </script>
</body>
</html>
