<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="https://xpdevs.github.io/Genesis-AI/icon.ico">
<link rel="stylesheet" href="https://xpdevs.github.io/Genesis-AI/styles/ui.css">
<title>Genesis AI</title>
<style>
  /* Prevents initial flickering */
  body { visibility: hidden; background-color: #000; }
</style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn">+ New Chat</button>
      <button id="settingsBtn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
    <ul id="chatList" class="chat-list">
      </ul>
  </div>

  <div class="chat-main">
    <div class="chat-header">
      <h3 id="chatTitle">Genesis AI</h3>
    </div>

    <div id="chatBox" class="chat-box">
      </div>
    
    <div class="input-container">
      <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Genesis...">
        <button id="sendBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="white"/>
          </svg>
        </button>
      </div>

      <div id="contentWarning">
        Genesis may display inaccurate info. 
        <br>
        <a href="https://xpdevs.github.io/Genesis-AI/legal/privacy-policy" target="_blank">Privacy</a> • 
        <a href="https://xpdevs.github.io/Genesis-AI/legal/terms-of-service" target="_blank">Terms</a>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h2>Settings</h2>
      <div style="display: flex; justify-content: space-between; align-items: center; margin: 25px 0;">
        <span>Dark Mode</span>
        <label class="toggle">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>
      <button id="deleteAllChatsBtn" style="background:#ff4d4d; color:#fff; border:none; padding:12px; border-radius:20px; width:100%; cursor:pointer; font-weight:500;">
        Delete All Chats
      </button>
      <div class="modal-actions">
        <button class="cancel" onclick="document.getElementById('settingsModal').style.display='none'">Close</button>
      </div>
    </div>
  </div>

  <div id="renameModal" class="modal">
    <div class="modal-content">
      <h2>Rename Chat</h2>
      <input type="text" id="renameInput" placeholder="New chat name...">
      <div class="modal-actions">
        <button class="confirm" id="renameConfirm">Rename</button>
        <button class="cancel" onclick="document.getElementById('renameModal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h2>Delete Chat?</h2>
      <p>This will be permanently removed.</p>
      <div class="modal-actions">
        <button class="confirm" id="deleteConfirm" style="background:#ff4d4d; color:white;">Delete</button>
        <button class="cancel" onclick="document.getElementById('deleteModal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>

  <div id="shareModal" class="modal">
    <div class="modal-content">
      <h2>Share Chat</h2>
      <div style="display: flex; gap: 8px; margin: 15px 0;">
        <input type="text" id="shareLinkInput" readonly style="flex-grow: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text);">
        <button id="copyShareLinkBtn" style="background:var(--primary); color:#fff; border:none; padding:0 15px; border-radius:12px; cursor:pointer;">Copy</button>
      </div>
      <div class="modal-actions">
        <button class="cancel" onclick="document.getElementById('shareModal').style.display='none'">Close</button>
      </div>
    </div>
  </div>
  
<script>
  // Sequence for launching the ecosystem
  (async () => {
    const loadModule = (url) => new Promise(resolve => {
      const s = document.createElement('script');
      s.src = `${url}?v=${Date.now()}`;
      s.onload = resolve;
      document.head.appendChild(s);
    });

    // Start with the loader
    await loadModule('https://xpdevs.github.io/Genesis-AI/js/loading.js');
    document.body.style.visibility = 'visible';

    // Load logic
    loadModule('https://xpdevs.github.io/Genesis-AI/js/main.js');
    loadModule('https://xpdevs.github.io/Genesis-AI/js/summarise.js');
  })();
</script>
</body>
</html>
