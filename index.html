<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icon.ico">
<title>Genesis AI Chat</title>

<style>
  /* Base Styles & Modern UI */
  :root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --sidebar-bg: #f8f9fa;
    --accent-color: #007bff;
    --border-radius: 12px;
  }

  body.dark-mode {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --sidebar-bg: #1e1e1e;
  }

  body { 
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    height: 100vh;
    background-color: var(--bg-color);
    color: var(--text-color);
    visibility: hidden; /* Prevent flash */
  }

  /* Sidebar */
  .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid #444; display: flex; flex-direction: column; }
  .sidebar-header { padding: 15px; display: flex; gap: 10px; }
  #newChatBtn { flex-grow: 1; padding: 10px; border-radius: var(--border-radius); border: none; background: var(--accent-color); color: white; cursor: pointer; }

  /* Main Chat Area */
  .chat-main { flex-grow: 1; display: flex; flex-direction: column; }
  .chat-header { padding: 15px; border-bottom: 1px solid #444; text-align: center; }
  .chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; }
  
  .input-area { padding: 20px; display: flex; gap: 10px; }
  #userInput { flex-grow: 1; padding: 12px; border-radius: var(--border-radius); border: 1px solid #444; background: transparent; color: inherit; }
  #sendBtn { padding: 10px 20px; border-radius: var(--border-radius); border: none; background: var(--accent-color); color: white; cursor: pointer; }

  /* Modals */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
  .modal-content { background: var(--bg-color); padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
  .modal-actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
  
  /* Buttons */
  .confirm { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
  .cancel { background: #666; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
  .danger-btn { background: #dc3545; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
</style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn">+ New Chat</button>
      <button id="settingsBtn">⚙️</button>
    </div>
    <ul id="chatList" class="chat-list"></ul>
  </div>

  <div class="chat-main">
    <div class="chat-header">
      <h3 id="chatTitle">New Chat</h3>
    </div>
    <div id="chatBox" class="chat-box"></div>
    
    <div id="contentWarning" style="padding:8px; background:#fff3cd; color:#856404; border:1px solid #ffeeba; border-radius:6px; margin:0 16px 8px 16px; font-size:0.9em;">
      Content Warning: Content may be inaccurate or biased. 
      See <a href="https://xpdevs.github.io/Genesis-AI/legal/privacy-policy" target="_blank" style="color:#856404;">Privacy Policy</a>.
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h2>Settings</h2>
      <div style="margin-bottom: 20px;">
        <label>Dark Mode: <input type="checkbox" id="themeToggle"></label>
      </div>
      
      <button id="deleteAllChatsBtn" style="background:#ff4d4d; color:white; border:none; padding:8px; border-radius:8px; cursor:pointer; width:100%; margin-bottom:10px;">
        Delete All Chats
      </button>

      <div style="border-top: 1px solid #444; padding-top: 15px; margin-top: 15px;">
        <button id="resetAllDataBtn" class="danger-btn">
          FACTORY RESET
        </button>
        <p style="font-size: 0.75em; color: #888; margin-top: 8px;">Deletes chats, settings, and legal agreements.</p>
      </div>
      <br>
      <button class="cancel" onclick="document.getElementById('settingsModal').style.display='none'">Close</button>
    </div>
  </div>

  <div id="resetAllModal" class="modal">
    <div class="modal-content">
      <h2>Complete Wipe?</h2>
      <p>This will delete all chats and force you to re-agree to the Terms of Service.</p>
      <div class="modal-actions">
        <button class="confirm" id="resetAllConfirm" style="background:#dc3545;">Yes, Wipe Everything</button>
        <button class="cancel" id="resetAllCancel">Cancel</button>
      </div>
    </div>
  </div>

<script>
  // Logic Implementation
  document.addEventListener('DOMContentLoaded', () => {
    document.body.style.visibility = 'visible';

    // Elements
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const resetAllDataBtn = document.getElementById('resetAllDataBtn');
    const resetAllModal = document.getElementById('resetAllModal');
    const resetAllConfirm = document.getElementById('resetAllConfirm');
    const resetAllCancel = document.getElementById('resetAllCancel');
    const themeToggle = document.getElementById('themeToggle');

    // Load Theme
    if(localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      themeToggle.checked = true;
    }

    // Toggle Theme
    themeToggle.onchange = () => {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    };

    // Modal Control
    settingsBtn.onclick = () => settingsModal.style.display = 'flex';
    
    resetAllDataBtn.onclick = () => {
      settingsModal.style.display = 'none';
      resetAllModal.style.display = 'flex';
    };

    resetAllCancel.onclick = () => resetAllModal.style.display = 'none';

    // --- FACTORY RESET LOGIC ---
    resetAllConfirm.onclick = () => {
      // Wipes all localStorage including XPDevs metadata and JSON chats
      localStorage.clear();
      sessionStorage.clear();
      
      // Reload to initial state
      window.location.reload();
    };

    // Close modals on outside click
    window.onclick = (event) => {
      if (event.target.className === 'modal') {
        event.target.style.display = 'none';
      }
    };
  });
</script>
</body>
</html>
