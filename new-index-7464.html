<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <title>Genesis AI Chat</title>
</head>
<body>
  <div class="gemini-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn menu-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <button id="newChatBtn" class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
      </div>
      <div class="sidebar-bottom">
        <button id="settingsBtn" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
      <ul id="chatList" style="display:none;"></ul>
    </aside>

    <main class="main-content">
      <header class="top-nav">
        <div class="brand" id="chatTitle">Genesis AI</div>
        <div class="nav-right">
          <button class="upgrade-btn">✨ Upgrade</button>
          <div class="user-avatar"><img src="https://csspicker.dev/api/image/?q=portrait+man" alt="User"></div>
        </div>
      </header>

      <section class="hero-section" id="heroSection">
        <div class="greeting">
          <span class="sparkle-icon-large">✨</span>
          <span class="greeting-text">Hi James</span>
        </div>
        <h1 class="main-title">Where should we start?</h1>
      </section>

      <div id="chatBox"></div>

      <div class="input-container">
        <div class="input-wrapper">
          <textarea id="userInput" placeholder="Ask Genesis..." rows="1"></textarea>
          <div class="input-actions">
            <button class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
            <button id="sendBtn" class="icon-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
        <div class="suggestion-chips">
          <button class="chip">Create image</button>
          <button class="chip">Write anything</button>
          <button class="chip">Help me learn</button>
        </div>
      </div>
    </main>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content"><input type="checkbox" id="themeToggle"><button id="deleteAllChatsBtn">Delete All</button></div>
  </div>
  <div id="renameModal" class="modal">
    <div class="modal-content"><input type="text" id="renameInput"><button id="renameConfirm">OK</button><button id="renameCancel">Cancel</button></div>
  </div>
  <div id="deleteModal" class="modal">
    <div class="modal-content"><button id="deleteConfirm">Delete</button><button id="deleteCancel">Cancel</button></div>
  </div>
  <div id="deleteAllModal" class="modal">
    <div class="modal-content"><button id="deleteAllConfirm">Yes</button><button id="deleteAllCancel">No</button></div>
  </div>
  <div id="shareModal" class="modal">
    <div class="modal-content"><input type="text" id="shareLinkInput"><button id="copyShareLinkBtn">Copy</button><button id="shareCancel">Close</button></div>
  </div>

  <script>
    const load = (src, defer = false) => {
      const s = document.createElement('script');
      s.src = `${src}?v=${Date.now()}`;
      if (defer) s.defer = true;
      document.head.appendChild(s);
    };
    load('https://xpdevs.github.io/Genesis-AI/js/loading.js');
    load('https://xpdevs.github.io/Genesis-AI/js/main.js', true);
    load('https://xpdevs.github.io/Genesis-AI/js/summarise.js', true);
  </script>
</body>
</html>
