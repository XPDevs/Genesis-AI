<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <title>Genesis AI Chat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500&display=swap');

    :root {
      --bg-color: #0e0e0e;
      --sidebar-bg: #131314;
      --input-bg: #1e1f20;
      --text-primary: #e3e3e3;
      --text-secondary: #9e9e9e;
      --accent-color: #4285f4;
      --border-color: #333;
      --modal-bg: #1e1f20;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Prevents the white flash before the loading script executes */
    body { 
      visibility: hidden; 
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .gemini-container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 68px;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 0;
      align-items: center;
      transition: width 0.3s ease;
      z-index: 10;
    }

    .sidebar.expanded {
      width: 260px;
      align-items: flex-start;
      padding: 16px;
    }

    .sidebar-top, .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: white;
    }

    .chat-list {
      list-style: none;
      width: 100%;
      margin-top: 20px;
      overflow-y: auto;
      display: none;
    }

    .sidebar.expanded .chat-list {
      display: block;
    }

    /* Main Content Styles */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
    }

    .brand {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .upgrade-btn {
      background: #1e1f20;
      border: 1px solid #333;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #444;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Chat Display Box */
    .chat-box {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    /* Hero Section (Hidden when chatting) */
    .hero-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 40px;
    }

    .greeting {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sparkle-icon-large {
      font-size: 20px;
      background: linear-gradient(45deg, #4285f4, #9b72cb, #d96570);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .greeting-text {
      font-size: 24px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .main-title {
      font-family: 'Outfit', sans-serif;
      font-size: 44px;
      font-weight: 400;
      margin-bottom: 40px;
      color: var(--text-primary);
      text-align: center;
    }

    /* Bottom Input Area */
    .bottom-controls {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-container {
      width: 100%;
      max-width: 720px;
      margin-bottom: 12px;
    }

    .input-wrapper {
      background-color: var(--input-bg);
      border-radius: 28px;
      padding: 16px 24px 12px 24px;
      transition: background 0.2s;
      border: 1px solid transparent;
    }

    .input-wrapper:focus-within {
      background-color: #28292a;
      border-color: #444;
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 200px;
    }

    .input-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .left-actions, .right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn, .send-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn {
      color: var(--accent-color);
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--modal-bg);
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border-color);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }

    .confirm, .cancel {
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
    }

    .confirm { background: var(--accent-color); color: white; }
    .cancel { background: #333; color: white; }

    .warning-banner {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      max-width: 600px;
      line-height: 1.4;
    }

    .warning-banner a { color: var(--text-secondary); text-decoration: underline; }

    /* Utility */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="gemini-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" id="menuToggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <button class="icon-btn" id="newChatBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
        <ul id="chatList" class="chat-list"></ul>
      </div>
      <div class="sidebar-bottom">
        <button class="icon-btn" id="settingsBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-nav">
        <div class="brand" id="chatTitle">Genesis AI</div>
        <div class="nav-right">
          <button class="upgrade-btn">✨ Upgrade</button>
          <div class="user-avatar">
            <img src="https://csspicker.dev/api/image/?q=portrait+man&image_type=photo" alt="User">
          </div>
        </div>
      </header>

      <!-- Chat History -->
      <div id="chatBox" class="chat-box hidden"></div>

      <!-- Hero Greeting -->
      <section class="hero-section" id="heroSection">
        <div class="greeting">
          <span class="sparkle-icon-large">✨</span>
          <span class="greeting-text">Hi James</span>
        </div>
        <h1 class="main-title">Where should we start?</h1>
      </section>

      <div class="bottom-controls">
        <div class="input-container">
          <div class="input-wrapper">
            <textarea id="userInput" placeholder="Ask Genesis AI" rows="1"></textarea>
            <div class="input-actions">
              <div class="left-actions">
                <button class="action-btn">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
              </div>
              <div class="right-actions">
                <button class="send-btn" id="sendBtn">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        
        <div class="warning-banner">
          Content may be inaccurate. Do not treat it as professional advice.
          See <a href="https://xpdevs.github.io/Genesis-AI/legal/privacy-policy" target="_blank">Privacy Policy</a> and 
          <a href="https://xpdevs.github.io/Genesis-AI/legal/terms-of-service" target="_blank">Terms</a>.
        </div>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div id="settingsModal" class="modal"><div class="modal-content">
    <h2>Settings</h2>
    <div style="margin-top:15px;"><button id="deleteAllChatsBtn" class="cancel" style="background:#ff4d4d;width:100%;">Delete All Chats</button></div>
    <div class="modal-actions"><button class="cancel" onclick="document.getElementById('settingsModal').style.display='none'">Close</button></div>
  </div></div>

  <div id="renameModal" class="modal"><div class="modal-content">
    <h2>Rename Chat</h2>
    <input type="text" id="renameInput" style="width:100%;padding:8px;margin-top:10px;background:#333;color:white;border:1px solid #444;border-radius:4px;">
    <div class="modal-actions">
      <button class="confirm" id="renameConfirm">Rename</button>
      <button class="cancel" id="renameCancel">Cancel</button>
    </div>
  </div></div>

  <div id="deleteModal" class="modal"><div class="modal-content">
    <h2>Delete Chat?</h2>
    <p>This cannot be undone.</p>
    <div class="modal-actions">
      <button class="confirm" id="deleteConfirm" style="background:#ff4d4d;">Delete</button>
      <button class="cancel" id="deleteCancel">Cancel</button>
    </div>
  </div></div>

  <div id="shareModal" class="modal"><div class="modal-content">
    <h2>Share Link</h2>
    <div style="display:flex;gap:8px;margin:15px 0;">
      <input type="text" id="shareLinkInput" readonly style="flex:1;padding:8px;background:#333;color:white;border:1px solid #444;">
      <button id="copyShareLinkBtn" class="confirm">Copy</button>
    </div>
    <div class="modal-actions"><button class="cancel" id="shareCancel">Close</button></div>
  </div></div>

  <script>
    // Logic to toggle sidebar expansion
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('expanded');
    });

    // Auto-resize textarea
    const tx = document.getElementById("userInput");
    tx.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    }, false);

    // Initial load overlay logic from your index.html
    const loadingScript = document.createElement('script');
    loadingScript.src = `https://xpdevs.github.io/Genesis-AI/js/loading.js?v=${Date.now()}`;
    loadingScript.onload = () => { document.body.style.visibility = 'visible'; };
    loadingScript.onerror = () => { document.body.style.visibility = 'visible'; };
    document.head.appendChild(loadingScript);

    // Main logic files
    const scripts = [
      `https://xpdevs.github.io/Genesis-AI/js/main.js?v=${Date.now()}`,
      `https://xpdevs.github.io/Genesis-AI/js/summarise.js?v=${Date.now()}`
    ];
    scripts.forEach(src => {
      const s = document.createElement('script');
      s.src = src;
      s.defer = true;
      document.head.appendChild(s);
    });

    // Handle Hero/Chatbox visibility toggle (pseudo-logic for main.js to hook into)
    const chatBox = document.getElementById('chatBox');
    const heroSection = document.getElementById('heroSection');
    
    // Observer to show chatBox when it has children
    const observer = new MutationObserver(() => {
      if (chatBox.children.length > 0) {
        chatBox.classList.remove('hidden');
        heroSection.classList.add('hidden');
      } else {
        chatBox.classList.add('hidden');
        heroSection.classList.remove('hidden');
      }
    });
    observer.observe(chatBox, { childList: true });
  </script>
</body>
</html>
