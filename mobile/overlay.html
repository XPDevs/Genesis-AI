<!DOCTYPE html>
<html lang="en-GB" style="background-color: #000;">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="https://xpdevs.github.io/Genesis-AI/icon.ico">
<title>Genesis AI</title>

<style>
  :root {
    --primary: #ffffff;
    --text: #ffffff;
    --bg: #000000;
    --input-bg: #111111;
    --border: #222222;
  }

  html, body { 
    background-color: #000 !important; 
    margin: 0; 
    padding: 0; 
    height: 100%;
    font-family: sans-serif;
    overflow: hidden;
    color: var(--text);
  }

  /* Keep elements active for logic but completely out of sight */
  .sidebar, .chat-header, #contentWarning, .modal, #sidebarToggle, 
  #settingsModal, #deleteAccountModal, #deleteAllModal, #refreshWarningModal, 
  #devModal, #renameModal, #deleteModal, #shareModal, #readOnlyBanner,
  #greeting {
    display: none !important;
    opacity: 0 !important;
    pointer-events: none !important;
    position: absolute !important;
    visibility: hidden !important;
  }

  /* Hide User Messages and specific Action Buttons */
  .user-message, 
  .message.user,
  .copy-btn,
  .listen-btn,
  .speaker-icon,
  [title*="Copy"],
  [title*="Listen"],
  [title*="Speak"],
  [class*="speaker"],
  [class*="audio"] {
    display: none !important;
  }

  .chat-main {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    background: var(--bg);
    position: relative;
    z-index: 1;
  }

  #chatBox {
    flex-grow: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex !important;
    flex-direction: column;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }

  .input-container {
    padding: 15px;
    background: #000;
    display: block !important;
    box-sizing: border-box;
  }

  #inputArea {
    display: flex !important;
    align-items: center;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 6px 14px;
    max-width: 800px;
    margin: 0 auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    box-sizing: border-box;
  }

  #userInput {
    flex-grow: 1;
    background: transparent;
    border: none;
    color: #fff;
    padding: 10px;
    font-size: 16px;
    outline: none;
    min-width: 0;
  }

  #sendBtn, #uploadBtn {
    background: none;
    border: none;
    cursor: pointer;
    color: #fff;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Specific sizing for the send icon to look better in the pill */
  #sendBtn svg {
    width: 22px;
    height: 22px;
  }

  #suggestionBox {
    display: none !important;
  }

  /* Mobile Adjustments */
  @media (max-width: 600px) {
    #chatBox {
      padding: 15px;
    }
    .input-container {
      padding: 10px;
      padding-bottom: 25px; /* Extra space for home indicators */
    }
    #inputArea {
      padding: 4px 10px;
    }
  }
</style>
</head>
<body>
  <div id="greeting" style="display:none;"></div>

  <div class="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn"></button>
      <button id="settingsBtn"></button>
    </div>
    <ul id="chatList"></ul>
  </div>

  <div class="chat-main">
    <div class="chat-header">
      <button id="sidebarToggle"></button>
      <h3 id="chatTitle"></h3>
    </div>
    <div id="readOnlyBanner"></div>
    <div id="chatBox"></div>
    <div class="input-container">
      <div id="inputArea">
        <div id="suggestionBox"></div>
        <button id="uploadBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="file" id="imgUploadInput" accept="image/*" style="display: none;">
        <input type="text" id="userInput" placeholder="Message..." autocomplete="off">
        <button id="sendBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="white"/>
          </svg>
        </button>
      </div>
      <div id="contentWarning"></div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <input type="checkbox" id="themeToggle">
    <input type="checkbox" id="autoThemeToggle">
    <select id="modelSelect">
      <option value="https://xpdevs.github.io/Genesis-AI/modals/Genesis-SPT-4.5-240126P1105M.bin">Default</option>
    </select>
    <span id="modelNameDisplay"></span>
    <span id="modelParamsDisplay"></span>
    <button id="deleteAllChatsBtn"></button>
    <button id="deleteAccountBtn"></button>
  </div>
  <div id="deleteAccountModal" class="modal">
      <ul id="deleteAccountList"></ul>
      <button id="deleteAccountCancel"></button>
      <button id="deleteAccountConfirm"></button>
  </div>
  <div id="renameModal" class="modal"><input id="renameInput"><button id="renameConfirm"></button><button id="renameCancel"></button></div>
  <div id="deleteModal" class="modal"><button id="deleteConfirm"></button><button id="deleteCancel"></button></div>
  <div id="deleteAllModal" class="modal"><button id="deleteAllConfirm"></button><button id="deleteAllCancel"></button></div>
  <div id="shareModal" class="modal"><input id="shareLinkInput"><button id="copyShareLinkBtn"></button><button id="shareCancel"></button></div>
  <div id="refreshWarningModal" class="modal"><button id="refreshConfirm"></button><button id="refreshCancel"></button></div>
  <div id="devModal" class="modal">
      <div id="devModalWaiting"></div>
      <div id="devModalOptions">
          <span id="devCurrentModalName"></span>
          <span id="devCurrentModalMode"></span>
          <input type="file" id="customModelInput">
          <p id="uploadStatus"></p>
          <button id="devModalClose"></button>
          <button id="devModalCancel"></button>
      </div>
  </div>

<script>
  window.addEventListener('unhandledrejection', event => event.preventDefault());

  const loadScript = (src) => {
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = `${src}?v=${Date.now()}`;
      s.async = false; 
      s.onload = () => resolve(true);
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });
  };

  window.onload = async () => {
    localStorage.setItem("SETUP", "FLAG_TRUE");
    if (!localStorage.getItem("userInfo")) {
      localStorage.setItem("userInfo", JSON.stringify({ name: "User", id: Date.now() }));
    }

    window.GENESIS_CODE = "9980748324";

    const OriginalURL = window.URL;
    window.URL = function(url, base) {
      if (typeof url === 'string' && (url.includes('/home/james/') || url.includes('pillbar.html') || url.includes('file:'))) {
        return new OriginalURL(window.location.href);
      }
      try {
        return new OriginalURL(url, base);
      } catch (e) {
        return new OriginalURL(window.location.href);
      }
    };
    window.URL.prototype = OriginalURL.prototype;
    window.URL.createObjectURL = OriginalURL.createObjectURL;
    window.URL.revokeObjectURL = OriginalURL.revokeObjectURL;

    const originalPushState = window.history.pushState;
    window.history.pushState = function(state, title, url) {
      if (typeof url === 'string' && (url.includes('/home/james/') || url.includes('pillbar.html') || url.includes('file:'))) {
        return; 
      }
      try {
        return originalPushState.apply(this, arguments);
      } catch (e) {
        return;
      }
    };

    const originalReplaceState = window.history.replaceState;
    window.history.replaceState = function(state, title, url) {
      if (typeof url === 'string' && (url.includes('/home/james/') || url.includes('pillbar.html') || url.includes('file:'))) {
        return;
      }
      try {
        return originalReplaceState.apply(this, arguments);
      } catch (e) {
        return;
      }
    };

    const chatBox = document.getElementById('chatBox');
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        mutation.addedNodes.forEach((node) => {
          if (node.nodeType === 1) { 
            const text = node.innerText || node.textContent;
            
            if (text && (
                text.toLowerCase().includes("good morning") || 
                text.toLowerCase().includes("good afternoon") || 
                text.toLowerCase().includes("good evening")
            )) {
              node.style.setProperty('display', 'none', 'important');
              node.remove();
              return;
            }

            if (node.classList.contains('user-message') || node.classList.contains('user')) {
              node.style.setProperty('display', 'none', 'important');
              node.remove();
              return;
            }

            const actionButtons = node.querySelectorAll('.copy-btn, .listen-btn, .speaker-icon, button[title*="Copy"], button[title*="Listen"], button[title*="Speak"]');
            actionButtons.forEach(btn => btn.remove());
          }
        });
      });
    });
    observer.observe(chatBox, { childList: true, subtree: true });
    observer.observe(document.body, { childList: true, subtree: true });

    await loadScript('https://xpdevs.github.io/Genesis-AI/js/main.js');
    
    const parts = [
      'https://xpdevs.github.io/Genesis-AI/js/summarise.js',
      'https://xpdevs.github.io/Genesis-AI/js/calc.js',
      'https://xpdevs.github.io/Genesis-AI/js/ImgAuth.js',
      'https://xpdevs.github.io/Genesis-AI/js/TXTAuth.js'
    ];

    for (const item of parts) {
      await loadScript(item);
    }
  };
</script>
</body>
</html>
