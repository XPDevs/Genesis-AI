<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis-AI | Mobile Update</title>
    <style>
        /* Modern, rounded UI and dark mode styling */
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #3498db;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            visibility: hidden; /* Controlled by the loader script */
        }

        .container {
            padding: 2rem;
            max-width: 85%;
            background: var(--card-bg);
            border-radius: 20px; /* Modern rounded look */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            opacity: 0.9;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(52, 152, 219, 0.2);
            border-radius: 50px;
            font-size: 0.8rem;
            margin-top: 15px;
            border: 1px solid var(--accent-color);
        }
    </style>

    <script>
        const loadingScript = document.createElement('script');
        // Adjusted path to include /Genesis-AI/
        loadingScript.src = `https://xpdevs.github.io/Genesis-AI/js/loading.js?v=${Date.now()}`;
        
        loadingScript.onload = () => {
            document.body.style.visibility = 'visible';
        };

        // Error handling if the script fails to load
        loadingScript.onerror = () => {
            console.error("Loading script failed to load. Revealing UI.");
            document.body.style.visibility = 'visible';
        };

        document.head.appendChild(loadingScript);
    </script>
</head>
<body>

    <div class="container">
        <h1>Sorry!</h1>
        <p>Mobile support for <strong>Genesis-AI</strong> is currently unavailable.</p>
        <p>I am actively working on the mobile ecosystem to bring the full experience to your handheld device.</p>
        <div class="status-badge">Development in Progress</div>
    </div>

</body>
</html>
