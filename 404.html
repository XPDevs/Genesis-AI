<!DOCTYPE html>
<html lang="en-GB" style="background-color: #000;">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Genesis AI - Under Maintenance</title>
<style>
  html, body {
    background-color: #000 !important;
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: sans-serif;
    overflow: hidden;
  }

  #maintenanceOverlay {
    display: flex;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    z-index: 999999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, sans-serif;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #maintenanceOverlay .maint-icon-big {
    width: 120px;
    height: 120px;
    margin-bottom: 32px;
  }
  #maintenanceOverlay .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  #maintenanceOverlay .brand-row img {
    width: 32px;
    height: 32px;
    border-radius: 6px;
  }
  #maintenanceOverlay .brand-row span {
    font-size: 16px;
    font-weight: 500;
    color: #6e6e73;
  }
  #maintenanceOverlay .maint-heading {
    font-size: 1.8rem;
    font-weight: 500;
    color: #1f1f1f;
    margin: 0 0 8px 0;
  }
  #maintenanceOverlay .maint-desc {
    color: #6e6e73;
    font-size: 16px;
    margin: 0 0 32px 0;
    line-height: 1.6;
    max-width: 400px;
  }
  #maintenanceOverlay a {
    background: #1a73e8;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: none;
  }
  #maintenanceOverlay a:hover {
    filter: brightness(0.9);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div id="maintenanceOverlay">
    <img src="https://xpdevs.github.io/Genesis-AI/images/maintenance-icon.png" alt="" class="maint-icon-big">
    <h1 class="maint-heading">Under Maintenance</h1>
    <p class="maint-desc">Genesis-AI is currently under maintenance. We appreciate your patience and will be back soon.</p>
    <div class="brand-row">
      <img src="https://xpdevs.github.io/Genesis-AI/icon.png" alt="">
      <span>Genesis-AI</span>
    </div>
    <a href="status/Status.html">View Status &rarr;</a>
  </div>
  <script>
    document.documentElement.style.backgroundColor = '#fff';
  </script>
</body>
</html>
