<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status | Genesis-AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6e6e73;
            --border-color: #e5e5e5;
            --success: #10a37f;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: #f9f9fb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d0d0d;
                --text-main: #ececec;
                --text-muted: #b4b4b4;
                --border-color: #2d2d2d;
                --card-bg: #1a1a1a;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin-top: 40px;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        .nav-back {
            position: absolute;
            top: 0;
            left: 0;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-back:hover {
            color: var(--text-main);
        }

        .brand {
            font-weight: 600;
            font-size: 24px;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .brand img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
        }

        .status-banner {
            background-color: var(--success);
            color: white;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            font-weight: 500;
            margin-bottom: 32px;
            box-shadow: 0 4px 12px rgba(16, 163, 127, 0.2);
        }

        .status-grid {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .service-name {
            font-weight: 500;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
        }

        .dot.operational { background-color: var(--success); }
        .dot.maintenance { background-color: var(--warning); }
        .dot.outage { background-color: var(--danger); }

        .operational-text { color: var(--success); }
        .maintenance-text { color: var(--warning); }
        .outage-text { color: var(--danger); }

        .uptime-row {
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
        }

        .uptime-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .uptime-bar {
            display: flex;
            gap: 2px;
            height: 30px;
        }

        .bar-segment {
            flex: 1;
            background-color: var(--success);
            border-radius: 2px;
            opacity: 0.8;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <a href="https://xpdevs.github.io/Genesis-AI" class="nav-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back
        </a>
        <div class="brand">
            <img src="https://xpdevs.github.io/Genesis-AI/icon.png" alt="Icon" onerror="this.style.display='none'">
            Genesis-AI
        </div>
        <p style="color: var(--text-muted);">Status</p>
    </header>

    <div id="loading">Checking...</div>

    <div id="content" style="display: none;">
        <div class="status-banner" id="main-status">
            All Operational
        </div>

        <div class="status-grid" id="systems-grid">
            <!-- Filled via data -->
        </div>

        <div class="uptime-row">
            <div class="uptime-header">
                <span class="service-name">Reliability (Last 30 Days)</span>
                <span id="uptime-percentage" style="color: var(--success)">100%</span>
            </div>
            <div class="uptime-bar" id="uptime-bar">
                <!-- Segments filled via data -->
            </div>
            <div class="uptime-header" style="margin-top: 8px; font-size: 11px; color: var(--text-muted);">
                <span>30 days ago</span>
                <span>Today</span>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 XPDevs & Genesis-AI</p>
    </footer>
</div>

<script>
    async function loadStatus() {
        const loading = document.getElementById('loading');
        const content = document.getElementById('content');
        const systemsGrid = document.getElementById('systems-grid');
        const barContainer = document.getElementById('uptime-bar');
        const banner = document.getElementById('main-status');
        const uptimePercent = document.getElementById('uptime-percentage');

        try {
            const response = await fetch('https://xpdevs.github.io/Genesis-AI/status/history.json');
            if (!response.ok) throw new Error();
            
            const data = await response.json();
            
            loading.style.display = 'none';
            content.style.display = 'block';

            let allFine = true;
            systemsGrid.innerHTML = '';
            
            for (const [name, status] of Object.entries(data.systems || {})) {
                const s = status.toLowerCase();
                if (s !== 'operational') allFine = false;

                const item = document.createElement('div');
                item.className = 'status-item';
                item.innerHTML = `
                    <span class="service-name">${name}</span>
                    <div class="status-indicator">
                        <span class="${s}-text">${status}</span>
                        <span class="dot ${s}"></span>
                    </div>
                `;
                systemsGrid.appendChild(item);
            }

            if (!allFine) {
                banner.innerText = "Maintenance Underway";
                banner.style.backgroundColor = "var(--warning)";
            }

            const history = data.history || [];
            barContainer.innerHTML = '';
            
            for (let i = 0; i < 40; i++) {
                const segment = document.createElement('div');
                segment.className = 'bar-segment';
                if (history[i]) {
                    const hS = history[i].toLowerCase();
                    if (hS === 'maintenance') segment.style.backgroundColor = 'var(--warning)';
                    if (hS === 'outage') segment.style.backgroundColor = 'var(--danger)';
                }
                barContainer.appendChild(segment);
            }

            if (data.uptime) uptimePercent.innerText = data.uptime;

        } catch (e) {
            loading.innerText = "Check connection.";
        }
    }

    window.onload = loadStatus;
</script>

</body>
</html>
