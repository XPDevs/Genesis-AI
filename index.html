<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icon.ico">
<title>Genesis AI Chat</title>

<style>
  /* Prevents the white flash */
  body { visibility: hidden; background-color: #000; margin: 0; display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar Base Styles & Animation */
  .sidebar {
    width: 260px;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #333;
    position: relative;
    overflow: hidden;
  }

  /* Collapsed State */
  .sidebar.collapsed {
    width: 60px;
  }

  .sidebar-header {
    padding: 15px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  /* Rounded Buttons */
  #newChatBtn, #settingsBtn, #toggleSidebarBtn {
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  #newChatBtn {
    flex-grow: 1;
    white-space: nowrap;
    overflow: hidden;
    padding: 10px;
    background: #333;
    color: white;
  }

  /* Hide text when collapsed */
  .sidebar.collapsed #newChatBtn span {
    display: none;
  }

  /* Toggle Button Position */
  #toggleSidebarBtn {
    background: transparent;
    color: #888;
    padding: 5px;
    font-size: 1.2em;
  }

  .chat-main {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    background: #000;
  }
</style>
</head>
<body>
  <div id="sidebarContainer" class="sidebar"></div>

  <div class="chat-main">
    <div class="chat-header">
      <h3 id="chatTitle">New Chat</h3>
    </div>
    <div id="chatBox" class="chat-box"></div>
    
    <div id="contentWarning" style="padding:8px; background:#fff3cd; color:#856404; border:1px solid #ffeeba; border-radius:6px; margin:0 16px 8px 16px; font-size:0.9em;">
      Content Warning: Content may be inaccurate or biased. 
      See <a href="https://xpdevs.github.io/Genesis-AI/legal/privacy-policy" target="_blank" style="color:#856404; text-decoration:underline;">Privacy Policy</a>.
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div id="settingsModal" class="modal">...</div>

<script>
  // Loading Script
  const loadingScript = document.createElement('script');
  loadingScript.src = `https://xpdevs.github.io/Genesis-AI/js/loading.js?v=${Date.now()}`;
  loadingScript.onload = () => { document.body.style.visibility = 'visible'; };
  document.head.appendChild(loadingScript);

  // Sidebar Script
  const sidebarScript = document.createElement('script');
  sidebarScript.src = `https://xpdevs.github.io/Genesis-AI/js/sidebar.js?v=${Date.now()}`;
  sidebarScript.defer = true;
  document.head.appendChild(sidebarScript);

  // Main & Summary Scripts
  const scripts = ['main.js', 'summarise.js'];
  scripts.forEach(s => {
    const sc = document.createElement('script');
    sc.src = `https://xpdevs.github.io/Genesis-AI/js/${s}?v=${Date.now()}`;
    sc.defer = true;
    document.head.appendChild(sc);
  });
</script>
</body>
</html>
