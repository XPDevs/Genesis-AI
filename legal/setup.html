<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis-AI | Legal Consent</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --card: #161616;
            --accent: #3b82f6;
            --text: #e5e7eb;
            --border: #2d2d2d;
            --radius: 12px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        .consent-box {
            background: var(--card);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 { margin-top: 0; font-size: 1.25rem; }
        p { color: #9ca3af; font-size: 0.9rem; margin-bottom: 2rem; }

        .checkbox-container {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 2rem;
        }

        .row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        input[type="checkbox"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
            margin-top: 2px;
        }

        /* Dark Modal Wrapper */
        #legal-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 1000;
            flex-direction: column;
        }

        /* Dark Header to match the UI */
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            background: var(--card);
        }

        .btn-back {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* White Frame for Black Text content */
        .modal-content-frame {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        .legal-link {
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
        }

        .btn-continue {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-continue:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="consent-box">
    <h2>Legal Agreement</h2>
    <p>Please review and accept our policies to continue to Genesis-AI.</p>

    <div class="checkbox-container">
        <label class="row">
            <input type="checkbox" id="tos">
            <span>I have read and agree to the <span class="legal-link" onclick="openModal('https://xpdevs.github.io/Genesis-AI/legal/terms-of-service')">Terms of Service</span></span>
        </label>
        
        <label class="row">
            <input type="checkbox" id="pp">
            <span>I have read and agree to the <span class="legal-link" onclick="openModal('https://xpdevs.github.io/Genesis-AI/legal/privacy-policy')">Privacy Policy</span></span>
        </label>
    </div>

    <button id="proceed" class="btn-continue" disabled>Accept and Continue</button>
</div>

<div id="legal-modal">
    <div class="modal-header">
        <button class="btn-back" onclick="closeModal()">← Back</button>
    </div>
    <iframe id="modal-frame" class="modal-content-frame"></iframe>
</div>

<script>
    // Asset loading
    const loadingScript = document.createElement('script');
    loadingScript.src = `https://xpdevs.github.io/Genesis-AI/js/loading.js?v=${Date.now()}`;
    loadingScript.onload = () => { document.body.style.visibility = 'visible'; };
    loadingScript.onerror = () => { document.body.style.visibility = 'visible'; };
    document.head.appendChild(loadingScript);
    
    const modal = document.getElementById('legal-modal');
    const frame = document.getElementById('modal-frame');

    function openModal(url) {
        frame.src = url;
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
        frame.src = 'about:blank';
    }

    const tosCheck = document.getElementById('tos');
    const ppCheck = document.getElementById('pp');
    const btn = document.getElementById('proceed');

    function checkConsent() {
        btn.disabled = !(tosCheck.checked && ppCheck.checked);
    }

    tosCheck.addEventListener('change', checkConsent);
    ppCheck.addEventListener('change', checkConsent);

    btn.addEventListener('click', () => {
        localStorage.setItem("SETUP", "FLAG_TRUE");
        window.location.href = "https://xpdevs.github.io/Genesis-AI/";
    });
</script>

</body>
</html>
