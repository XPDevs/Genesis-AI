<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icon.ico">
<link rel="stylesheet" href="ui.css">
<title>Genesis AI Chat</title>

<style>
  /* Prevents the white flash before the loading script executes */
  body { visibility: hidden; background-color: #000; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn">+ New Chat</button>
      <button id="settingsBtn">⚙️</button>
    </div>
    <ul id="chatList" class="chat-list"></ul>
  </div>

  <div class="chat-main">
    <div class="chat-header">
      <h3 id="chatTitle">New Chat</h3>
    </div>
    
    <div id="chatBox" class="chat-box"></div>
    
    <div class="input-container">
      <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message...">
        <button id="sendBtn">Send</button>
      </div>

      <div id="contentWarning" style="padding:12px; color:#888; text-align:center; font-size:0.75em; line-height:1.4;">
        Genesis may display inaccurate info, including about people, so double-check its responses. 
        <br>
        <a href="https://xpdevs.github.io/Genesis-AI/legal/privacy-policy" target="_blank" style="color:inherit; text-decoration:underline;">Privacy Policy</a> and 
        <a href="https://xpdevs.github.io/Genesis-AI/legal/terms-of-service" target="_blank" style="color:inherit; text-decoration:underline;">Terms Of Service</a>.
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h2>Settings</h2>
      <div class="setting-item">
        <label class="toggle">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
        <span>Dark Mode</span>
      </div>
      <br>
      <div class="setting-item">
        <button id="deleteAllChatsBtn" style="background:#ff4d4d;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;">
          Delete All Chats
        </button>
      </div>
      <div class="modal-actions">
        <button class="cancel" onclick="document.getElementById('settingsModal').style.display='none'">Close</button>
      </div>
    </div>
  </div>

  <script>
  // 1. Load the Loading Overlay First
  const loadingScript = document.createElement('script');
  loadingScript.src = `https://xpdevs.github.io/Genesis-AI/js/loading.js?v=${Date.now()}`;
  
  loadingScript.onload = () => {
    document.body.style.visibility = 'visible';
  };

  loadingScript.onerror = () => {
    console.error("Loading script failed to load. Revealing UI.");
    document.body.style.visibility = 'visible';
  };

  document.head.appendChild(loadingScript);

  // 2. Load the Main Logic
  const mainScript = document.createElement('script');
  mainScript.src = `https://xpdevs.github.io/Genesis-AI/js/main.js?v=${Date.now()}`;
  mainScript.defer = true;
  document.head.appendChild(mainScript);

  // 3. Load the Summarization Logic
  const summaryScript = document.createElement('script');
  summaryScript.src = `https://xpdevs.github.io/Genesis-AI/js/summarise.js?v=${Date.now()}`;
  summaryScript.defer = true;
  document.head.appendChild(summaryScript);
</script>
</body>
</html>
