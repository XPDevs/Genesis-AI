<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis AI Chat</title>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn">+ New Chat</button>
      <button id="settingsBtn">⚙️</button>
    </div>
    <ul id="chatList" class="chat-list"></ul>
  </div>

  <div class="chat-main">
    <div class="chat-header">
      <h3 id="chatTitle">New Chat</h3>
    </div>
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h2>Settings</h2>
      <div class="setting-item">
        <label class="toggle">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
        <span>Dark Mode</span>
      </div>

      <div class="setting-item">
        <button id="deleteAllChatsBtn" style="background:#ff4d4d;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;">
          Delete All Chats
        </button>
      </div>

      <button class="close-btn" onclick="document.getElementById('settingsModal').style.display='none'">Close</button>
    </div>
  </div>

  <!-- Rename Modal -->
  <div id="renameModal" class="modal">
    <div class="modal-content">
      <h2>Rename Chat</h2>
      <input type="text" id="renameInput">
      <div class="modal-actions">
        <button class="confirm" id="renameConfirm">Rename</button>
        <button class="cancel" id="renameCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h2>Delete Chat?</h2>
      <p>This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="confirm" id="deleteConfirm">Delete</button>
        <button class="cancel" id="deleteCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Delete All Chats Modal -->
  <div id="deleteAllModal" class="modal">
    <div class="modal-content">
      <h2>Confirm Delete All</h2>
      <p>Are you sure you want to delete <strong>all chats</strong>? This cannot be undone.</p>
      <div class="modal-actions">
        <button class="confirm" id="deleteAllConfirm" style="background:#ff4d4d;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;">
          Yes, Delete All
        </button>
        <button class="cancel" id="deleteAllCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://xpdevs.github.io/Genesis-AI/js/main.js" defer></script>
</body>
</html>
