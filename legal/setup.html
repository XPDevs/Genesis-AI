<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genesis-AI Setup</title>
    <style>
        /* Global Reset & Device Consistency */
        html, body { 
            background-color: #000 !important; 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Prevent visibility flicker */
        body { visibility: hidden; }

        :root {
            --bg: #131314; /* Default to Dark Mode for XPDevs aesthetic */
            --text: #ffffff; /* Forced White Text */
            --primary: #8ab4f8;
            --border: #444746;
            --input-bg: #1e1f20;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 400px;
            width: 85%;
            padding: 20px;
            text-align: center;
            /* Ensure it stays centered on small mobile screens */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Text Styling */
        h1 { 
            margin-bottom: 15px; 
            font-size: 1.8rem;
            font-weight: 600;
            color: #ffffff; /* Explicit White */
        }

        p { 
            line-height: 1.5; 
            color: #ffffff; 
            opacity: 0.9; 
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Buttons with Rounded Modern UI */
        button {
            background-color: var(--primary);
            color: #000; /* Dark text on light blue button for contrast */
            border: none;
            padding: 14px 24px;
            border-radius: 28px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s, opacity 0.2s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        button:not(:disabled):active {
            transform: scale(0.98);
        }

        /* Input Styling */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 25px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        /* Checkbox Layout */
        .checkbox-group {
            text-align: left;
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start; /* Better for wrapped text on mobile */
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 12px;
            margin-top: 4px;
            min-width: 20px;
            min-height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.95rem;
            color: #ffffff;
            cursor: pointer;
            line-height: 1.4;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }

        /* Loading script handling */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="container" id="step1">
        <h1>Legal Agreement</h1>
        <p>Please review and accept our terms to continue.</p>
        
        <div class="checkbox-group">
            <input type="checkbox" id="tosCheckbox">
            <label for="tosCheckbox">
                I have read and agree to the <a href="terms-of-service.html" target="_blank">Terms of Service</a>.
            </label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="ppCheckbox">
            <label for="ppCheckbox">
                I have read and agree to the <a href="privacy-policy.html" target="_blank">Privacy Policy</a>.
            </label>
        </div>
        
        <button id="legalContinueBtn" disabled>Continue</button>
    </div>

    <div class="container hidden" id="step2">
        <h1>Profile Setup</h1>
        <p>How should Genesis-AI address you?</p>
        
        <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off">
        
        <button id="finishBtn">Finish Setup</button>
    </div>
    
    <script>
        const step1 = document.getElementById('step1');
        const tosCheckbox = document.getElementById('tosCheckbox');
        const ppCheckbox = document.getElementById('ppCheckbox');
        const legalContinueBtn = document.getElementById('legalContinueBtn');
        const step2 = document.getElementById('step2');
        const nameInput = document.getElementById('nameInput');
        const finishBtn = document.getElementById('finishBtn');

        function checkAgreements() {
            legalContinueBtn.disabled = !(tosCheckbox.checked && ppCheckbox.checked);
        }

        function completeSetup() {
            const name = nameInput.value.trim();
            if (name) {
                // Storing name in userInfo and setting setup flag
                localStorage.setItem('userInfo', JSON.stringify({ name: name }));
                localStorage.setItem('SETUP', 'FLAG_TRUE');
                window.location.href = '../index.html';
            } else {
                nameInput.focus();
            }
        }

        tosCheckbox.addEventListener('change', checkAgreements);
        ppCheckbox.addEventListener('change', checkAgreements);

        legalContinueBtn.addEventListener('click', () => {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            nameInput.focus();
        });

        finishBtn.addEventListener('click', completeSetup);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') completeSetup();
        });

        const loadScript = (src) => {
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = `${src}?v=${Date.now()}`;
                s.onload = resolve;
                document.head.appendChild(s);
            });
        };

        (async () => {
            // Loading your external loading logic
            await loadScript('https://xpdevs.github.io/Genesis-AI/js/loading.js');
            document.body.style.visibility = 'visible';
        })();
    </script>
</body>
</html>
