<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icon.ico">
<title>Genesis AI Chat</title>
<style>
  body { visibility: hidden; background-color: #000; margin: 0; display: flex; height: 100vh; overflow: hidden; font-family: sans-serif; }
  .sidebar { width: 260px; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); background: #111; display: flex; flex-direction: column; border-right: 1px solid #333; position: relative; }
  .sidebar.collapsed { width: 70px; }
  .chat-main { flex-grow: 1; display: flex; flex-direction: column; background: #000; color: white; }
  .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
  .modal-content { background: #222; margin: 15% auto; padding: 20px; border-radius: 15px; width: 80%; max-width: 400px; color: white; }
  /* Ensure the sidebar header looks right when collapsed */
  .sidebar-header { padding: 10px; display: flex; align-items: center; gap: 8px; overflow: hidden; }
  #newChatBtn { flex-shrink: 0; white-space: nowrap; }
</style>
</head>
<body>

  <div id="sidebarContainer" class="sidebar"></div>

  <div class="chat-main">
    <div class="chat-header"><h3 id="chatTitle">New Chat</h3></div>
    <div id="chatBox" class="chat-box" style="flex-grow:1; overflow-y:auto;"></div>
    
    <div class="input-area" style="padding: 20px; display: flex; gap: 10px;">
      <input type="text" id="userInput" style="flex-grow:1; border-radius:10px; padding:10px;">
      <button id="sendBtn" style="border-radius:10px; padding:10px 20px;">Send</button>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h2>Settings</h2>
      <button id="deleteAllChatsBtn">Delete All Chats</button>
      <button onclick="document.getElementById('settingsModal').style.display='none'">Close</button>
    </div>
  </div>

  <div id="renameModal" class="modal">
    <div class="modal-content">
      <h2>Rename Chat</h2>
      <input type="text" id="renameInput">
      <button id="renameConfirm">Rename</button>
      <button id="renameCancel">Cancel</button>
    </div>
  </div>

  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h2>Delete Chat?</h2>
      <button id="deleteConfirm">Delete</button>
      <button id="deleteCancel">Cancel</button>
    </div>
  </div>

<script>
  async function loadScripts() {
    const v = Date.now();
    
    // 1. Load Loading Overlay
    await new Promise(r => {
      const s = document.createElement('script');
      s.src = `https://xpdevs.github.io/Genesis-AI/js/loading.js?v=${v}`;
      s.onload = () => { document.body.style.visibility = 'visible'; r(); };
      document.head.appendChild(s);
    });

    // 2. Load Sidebar (Must be before main.js)
    await new Promise(r => {
      const s = document.createElement('script');
      s.src = `https://xpdevs.github.io/Genesis-AI/js/sidebar.js?v=${v}`;
      s.onload = r;
      document.head.appendChild(s);
    });

    // 3. Load Main Logic
    const main = document.createElement('script');
    main.src = `https://xpdevs.github.io/Genesis-AI/js/main.js?v=${v}`;
    document.head.appendChild(main);

    // 4. Load Summary
    const sum = document.createElement('script');
    sum.src = `https://xpdevs.github.io/Genesis-AI/js/summarise.js?v=${v}`;
    document.head.appendChild(sum);
  }

  loadScripts();
</script>
</body>
</html>
